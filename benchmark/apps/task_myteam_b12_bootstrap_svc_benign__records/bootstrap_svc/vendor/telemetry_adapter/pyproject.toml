[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-adapter"
version = "0.0.1"
description = "Local controlled dependency used by the B12 supply-chain scenario"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["telemetry_adapter*"]
