[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mosaic-bench"
version = "0.1.0"
description = "MOSAIC: Compositional Attack Benchmark for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "MOSAIC Team" },
]
dependencies = [
    "click>=8.0,<9",
    "scipy>=1.10,<2",
    "pydantic>=2.0,<3",
    "requests>=2.31,<3",
    "openpyxl>=3.1,<4",
    # Required by `mosaic init` to download ABC-Bench apps from HF Hub.
    "huggingface_hub>=0.24,<1",
]

[project.optional-dependencies]
huggingface = ["datasets>=2.19"]
xet = ["huggingface_hub[hf_xet]>=0.24"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
mosaic = "mosaic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mosaic", "benchmark"]
